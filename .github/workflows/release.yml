name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CI: 'true'
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content src/SaruMon/SaruMon.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match project version $version." }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'This workflow publishes stable versions only (vMAJOR.MINOR.PATCH).' }

  package:
    needs: version
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SaruMon-win-x64
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          artifacts/SaruMon-win-x64.zip
          artifacts/SaruMon-win-x64.zip.sha256
          artifacts/SaruMon-*-Setup-x64.exe
          artifacts/SaruMon-*-SHA256SUMS.txt
          --verify-tag
          --title "SaruMon $RELEASE_TAG"
          --generate-notes
