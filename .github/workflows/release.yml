name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CI: 'true'
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& dotnet msbuild src/SaruMon/SaruMon.csproj -getProperty:Version -nologo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the project version.' }
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match project version $version." }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'This workflow publishes stable versions only (vMAJOR.MINOR.PATCH).' }
      - name: Test and package
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            artifacts/SaruMon-win-x64.zip
            artifacts/SaruMon-win-x64.zip.sha256
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          artifacts/SaruMon-win-x64.zip
          artifacts/SaruMon-win-x64.zip.sha256
          --verify-tag
          --title "SaruMon $RELEASE_TAG"
          --generate-notes
